<title>fullharness UI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: three-pane app shell — rail (switch), main (Session / Factory / Inbox), detail (Worktree). Stacks to one column on phones. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --sunken: #e8ecea;
  --line: #d5dcd9;
  --fg: #16201d;
  --muted: #5b6863;
  --accent: #0d6b5f;
  --accent-soft: #d5ece7;
  --on-accent: #ffffff;
  --waiting: #b45309;
  --waiting-soft: #fdecd3;
  --working: #2563eb;
  --working-soft: #dde7fd;
  --idle: #7a8580;
  --exited: #a3aca8;
  --good: #15803d;
  --bad: #b91c1c;
  --term-bg: #1b2421;
  --term-fg: #d7e2dd;
  --shadow: 0 1px 2px rgba(20,40,34,.06), 0 8px 24px rgba(20,40,34,.08);
  --f-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111816; --surface: #18211e; --sunken: #0d1311; --line: #2a3632; --fg: #e3ebe8; --muted: #93a19c;
  --accent: #3fb8a5; --accent-soft: #163a34; --on-accent: #0b1513;
  --waiting: #f2a541; --waiting-soft: #3a2a12; --working: #6c9cff; --working-soft: #1b2847;
  --idle: #7f8c87; --exited: #56625e; --good: #4ade80; --bad: #f87171;
  --term-bg: #0a0f0e; --term-fg: #cfdcd6; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111816; --surface: #18211e; --sunken: #0d1311; --line: #2a3632; --fg: #e3ebe8; --muted: #93a19c;
  --accent: #3fb8a5; --accent-soft: #163a34; --on-accent: #0b1513;
  --waiting: #f2a541; --waiting-soft: #3a2a12; --working: #6c9cff; --working-soft: #1b2847;
  --idle: #7f8c87; --exited: #56625e; --good: #4ade80; --bad: #f87171;
  --term-bg: #0a0f0e; --term-fg: #cfdcd6; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--f-mono); font-size: 12.5px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

.mock-note { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin: 0 auto 12px; max-width: 1400px; color: var(--muted); font-size: 12.5px; }
.mock-note strong { color: var(--fg); font-weight: 600; }

.app { max-width: 1400px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-height: 760px; }

/* top bar */
.top { display: flex; align-items: center; gap: 16px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand b { font-family: var(--f-display); font-size: 20px; letter-spacing: -.02em; }
.brand span { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 2px; background: var(--sunken); padding: 3px; border-radius: 8px; }
.tab { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; font-weight: 500; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.count { font-size: 11px; font-weight: 600; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--waiting); color: var(--surface); text-align: center; line-height: 18px; font-variant-numeric: tabular-nums; }
.count[data-zero] { background: var(--sunken); color: var(--muted); }
.jump { margin-left: auto; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 8px 5px 10px; color: var(--muted); min-width: 220px; }
.jump kbd { margin-left: auto; font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--surface); }

/* shell */
.shell { display: grid; grid-template-columns: 270px minmax(0,1fr) 290px; min-height: 0; }
.shell:not([data-view="sessions"]) { grid-template-columns: 270px minmax(0,1fr); }
.shell:not([data-view="sessions"]) .detail { display: none; }
.rail { border-right: 1px solid var(--line); background: var(--bg); padding: 12px 8px; display: flex; flex-direction: column; gap: 18px; overflow: auto; }
.rail h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 0 8px 6px; display: flex; justify-content: space-between; }
.slist { display: flex; flex-direction: column; gap: 2px; list-style: none; margin: 0; padding: 0; }
.srow { width: 100%; display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap: 2px 10px; align-items: center; text-align: left; background: transparent; border: 0; border-radius: 7px; padding: 7px 8px; }
.srow:hover { background: var(--sunken); }
.srow[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.srow .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .s { grid-column: 2 / 4; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); }
.dot.waiting { background: var(--waiting); box-shadow: 0 0 0 3px var(--waiting-soft); }
.dot.working { background: var(--working); animation: pulse 1.6s ease-in-out infinite; }
.dot.exited { background: transparent; border: 2px solid var(--exited); }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--working-soft); } }
@media (prefers-reduced-motion: reduce) { .dot.working { animation: none; box-shadow: 0 0 0 3px var(--working-soft); } }
.state { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
.state.waiting { background: var(--waiting-soft); color: var(--waiting); }
.state.working { background: var(--working-soft); color: var(--working); }
.state.idle { background: var(--sunken); color: var(--muted); }
.state.exited { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }

.ptree { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.proj > div { display: flex; justify-content: space-between; align-items: baseline; padding: 0 8px; font-weight: 600; }
.proj > div small { font-weight: 400; color: var(--muted); font-size: 11.5px; }
.wts { list-style: none; margin: 4px 0 0; padding: 0 0 0 8px; }
.wt { display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 3px 8px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.wt span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-family: var(--f-body); font-size: 10.5px; padding: 0 6px; border-radius: 4px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.addp { margin: 0 8px; border: 1px dashed var(--line); background: transparent; border-radius: 7px; padding: 6px; color: var(--muted); }

/* main */
.main { min-width: 0; display: flex; flex-direction: column; }
.mhead { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.mhead h2 { font-family: var(--f-display); font-size: 19px; letter-spacing: -.01em; }
.crumb { color: var(--muted); font-size: 12.5px; }
.agent { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
.agent i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.seg { margin-left: auto; display: flex; background: var(--sunken); border-radius: 7px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 3px 10px; border-radius: 5px; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); }

.chat { flex: 1; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; max-height: 620px; }
.msg { max-width: 72ch; }
.msg.user { align-self: flex-end; background: var(--accent-soft); padding: 8px 12px; border-radius: 10px 10px 2px 10px; }
.msg.agent p { margin: 0 0 6px; }
.who { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 3px; font-weight: 600; }
.tool { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); max-width: 72ch; }
.tool summary { list-style: none; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 7px 10px; cursor: pointer; }
.tool summary::-webkit-details-marker { display: none; }
.tool summary code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool .k { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.ok { color: var(--good); font-size: 12px; } .run { color: var(--working); font-size: 12px; }
.tool pre { margin: 0; padding: 8px 12px; border-top: 1px solid var(--line); font-family: var(--f-mono); font-size: 12px; overflow-x: auto; color: var(--muted); }
.perm { border: 1px solid var(--waiting); background: var(--waiting-soft); border-radius: 10px; padding: 12px 14px; max-width: 72ch; display: grid; gap: 8px; }
.perm .q { font-weight: 600; color: var(--waiting); }
.perm code { display: block; background: var(--surface); padding: 6px 10px; border-radius: 6px; color: var(--fg); overflow-x: auto; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 5px 12px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { padding: 2px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.resolved { font-size: 12.5px; color: var(--muted); }
.composer { border-top: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 10px; align-items: center; }
.composer input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 8px 12px; font: inherit; }
.term { flex: 1; margin: 0; background: var(--term-bg); color: var(--term-fg); font-family: var(--f-mono); font-size: 12.5px; padding: 16px 18px; overflow: auto; max-height: 680px; white-space: pre; line-height: 1.5; }
.fallback-note { padding: 6px 18px; font-size: 12px; color: var(--muted); background: var(--sunken); border-bottom: 1px solid var(--line); }

/* detail */
.detail { border-left: 1px solid var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 18px; background: var(--bg); overflow: auto; }
.detail h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
dl.kv { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 6px 12px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.files { list-style: none; margin: 0; padding: 0; font-family: var(--f-mono); font-size: 12px; display: grid; gap: 3px; }
.files b { display: inline-block; width: 16px; font-weight: 500; }
.m { color: var(--waiting); } .a { color: var(--good); }
.hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.ticketcard { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; }

/* factory */
.fhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.pchip { border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 4px 12px; font-size: 13px; display: inline-flex; gap: 6px; align-items: baseline; }
.pchip small { color: var(--muted); font-size: 11.5px; }
.pchip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.fhead .btn.primary { margin-left: auto; }
.board-wrap { overflow-x: auto; padding: 16px 18px 8px; }
.board { display: grid; grid-template-columns: repeat(6, minmax(180px, 1fr)); gap: 10px; min-width: 1100px; }
.col h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.col .skill { text-transform: none; letter-spacing: 0; font-family: var(--f-mono); font-weight: 400; font-size: 11px; }
.col-body { background: var(--sunken); border-radius: 9px; padding: 6px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
.fcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 10px; display: grid; gap: 6px; }
.fcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.fcard .n { font-weight: 600; }
.fcard .ref { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--sunken); }
.bar span { display: block; }
.bd { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.next { font-size: 12px; color: var(--accent); font-weight: 600; }
.fdetail { margin: 8px 18px 18px; border: 1px solid var(--line); border-radius: 10px; }
.fdetail header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.fdetail header h3 { font-family: var(--f-display); font-size: 17px; }
.fdetail header .acts { margin-left: auto; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 13px; }
th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
.lbl { font-family: var(--f-mono); font-size: 11.5px; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.stage { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 10px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.stage.shipped { color: var(--good); } .stage.review { color: var(--accent); } .stage.implementing { color: var(--working); background: var(--working-soft); }
.stage.startable { color: var(--on-accent); background: var(--accent); }
.empty-note { padding: 14px 18px; color: var(--muted); }
.setup { margin: 24px 18px; border: 1px dashed var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 10px; max-width: 60ch; }

/* inbox */
.inbox { padding: 18px; display: grid; gap: 12px; max-width: 900px; }
.ibox { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.ibox .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ibox code { display: block; margin-top: 6px; background: var(--bg); padding: 6px 10px; border-radius: 6px; overflow-x: auto; }

/* overlays */
.scrim { position: fixed; inset: 0; background: rgba(10,20,17,.35); display: grid; place-items: start center; padding: 12vh 16px 16px; z-index: 50; }
.palette, .modal { width: min(560px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; font: inherit; font-size: 15px; background: transparent; color: var(--fg); outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 320px; overflow: auto; }
.palette li button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 7px; padding: 8px 10px; display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap: 10px; align-items: center; }
.palette li button:hover, .palette li button.hl { background: var(--sunken); }
.modal form { padding: 18px; display: grid; gap: 14px; }
.modal h3 { font-family: var(--f-display); font-size: 18px; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input[type=text] { border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; font: inherit; background: var(--bg); color: var(--fg); }
.radios { display: flex; flex-wrap: wrap; gap: 6px; }
.radios label { border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.radios label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.toggle { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.toggle small { display: block; color: var(--muted); }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 60; }

/* readiness + roadmap */
.rdy { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
.rdy.ready { color: var(--good); background: var(--sunken); }
.rdy.notready { color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.rdy.stale, .warn { color: var(--waiting); background: var(--waiting-soft); font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.checks { list-style: none; margin: 0; padding: 12px 14px; display: grid; gap: 5px; border-bottom: 1px solid var(--line); font-size: 13px; }
.checks li { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 6px; }
.checks small { color: var(--muted); }
.c-ok { color: var(--good); } .c-bad { color: var(--bad); font-weight: 600; } .c-warn { color: var(--waiting); font-weight: 600; }
.assess { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
.assess .btn { margin-left: auto; }
.roadmap { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; padding: 16px 18px; }
.rcol h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.rlist { list-style: none; margin: 0; padding: 6px; background: var(--sunken); border-radius: 9px; min-height: 180px; display: flex; flex-direction: column; gap: 6px; }
.rcol.over .rlist { box-shadow: inset 0 0 0 2px var(--accent); }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; display: grid; gap: 6px; cursor: grab; }
.rcard.dragging { opacity: .5; }
.rcard .n { font-weight: 600; }
.rcard .ref { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.rtop { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.rmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rmove { display: flex; gap: 6px; justify-content: flex-end; }
.radios.stack { flex-direction: column; align-items: stretch; }
.radios label.dis { opacity: .5; cursor: not-allowed; }
.radios small { color: var(--muted); }
.radios input[type=text] { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font: inherit; font-family: var(--f-mono); font-size: 12.5px; background: var(--bg); color: var(--fg); }
.field select { border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; font: inherit; background: var(--bg); color: var(--fg); }
.modal ul.fails { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

@media (max-width: 1080px) {
  .shell, .shell[data-view] { grid-template-columns: 230px minmax(0,1fr); }
  .detail { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
}
@media (max-width: 720px) {
  .shell, .shell[data-view] { grid-template-columns: minmax(0,1fr); }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: 300px; }
  .jump { min-width: 0; flex: 1 1 100%; order: 3; }
  .chat { max-height: none; }
  .ibox { grid-template-columns: minmax(0,1fr); }

function bar(bd) {
  if (!bd) return "";
  const total = Object.values(bd).reduce((a, b) => a + b, 0);
  const parts = Object.entries(bd).map(([k, v]) => `<span style="width:${v / total * 100}%;background:${BD_COLORS[k]}"></span>`).join("");
  const txt = Object.entries(bd).map(([k, v]) => `${v} ${k}`).join(" · ");
  return `<div class="bar" aria-hidden="true">${parts}</div><div class="bd">${txt}</div>`;
}
function featCard(f) {
  return `<button class="fcard" data-feat="${f.id}" aria-pressed="${ui.feature === f.id}">
    <span class="n">${f.name}</span><span class="ref">${f.ref}</span>${rdBadge(f.id)}${bar(f.bd)}
    <span class="next">${f.next}${f.skill ? ` · <span class="mono">${f.skill}</span>` : ""}</span></button>`;
}
function featDetail(f) {
  const rows = (f.tickets || []).map(t => {
    const cls = t.stage.toLowerCase();
    const act = t.stage === "Startable" ? `<button class="btn primary small" data-start="${t.n}">Start Session</button>`
      : t.sid ? `<button class="btn small" data-open="${t.sid}">Open Session</button>` : "";
    return `<tr><td class="mono">#${t.n}</td><td>${t.t}</td><td><span class="lbl">${t.label || "ready-for-agent"}</span></td><td><span class="stage ${cls}">${t.stage === "Startable" ? "Startable" : t.stage}</span></td><td class="crumb">${t.note}</td><td>${act}</td></tr>`;
  }).join("");
  const r = RD[f.id], v = verdict(f.id);
  const gate = f.skill === "/implement-spec" && v === "Not ready";
  const mainBtn = f.skill
    ? (gate ? `<button class="btn primary" data-confirm="${f.id}">${f.next} · Not ready</button>` : `<button class="btn primary" data-toast="Session started: ${f.skill} for ${f.name}">${f.next}</button>`)
    : `<button class="btn">${f.next}</button>`;
  const checks = r ? `<ul class="checks" aria-label="Readiness checks">${CHECKS.map((c, i) => {
      const st = r.checks[i], cls = st === 1 ? "c-ok" : st === 0 ? "c-bad" : "c-warn", g = st === 1 ? "✓" : st === 0 ? "✗" : "!";
      const note = r.notes && r.notes[i] ? ` <small>· ${r.notes[i]}</small>` : "";
      return `<li><span class="${cls}" aria-label="${st === 1 ? "passes" : st === 0 ? "fails" : "warning"}">${g}</span><span>${c}${note}</span></li>`; }).join("")}</ul>
    <div class="assess"><strong>Readiness: ${v}</strong><span class="crumb">${r.assessNote || "No Assessment yet."}</span><button class="btn small" data-toast="Session started: /plan-readiness for ${f.name}">${r.assess ? "Assess again" : "Assess plan"}</button></div>` : "";
  return `<section class="fdetail"><header><h3>${f.name}</h3><span class="crumb">${f.ref} · Stage: ${f.stage}${f.tickets ? " (earliest open Ticket)" : ""}</span>${rdBadge(f.id)}
    <div class="acts">${mainBtn}</div></header>${checks}
    ${rows ? `<div class="tbl-wrap"><table><thead><tr><th>Ticket</th><th>Title</th><th>Label</th><th>Stage</th><th>Notes</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<p class="empty-note">Ticket list loads from the Issue tracker for this Feature.</p>`}</section>`;
}

function renderRoadmap() {
  const groups = [["now","Now"],["next","Next"],["later","Later"]], filt = ui.rmProject;
  const chips = `<button class="pchip" data-rmproj="" aria-pressed="${!filt}">All Projects</button>` +
    projects.filter(p => p.tracker).map(p => `<button class="pchip" data-rmproj="${p.id}" aria-pressed="${filt === p.id}">${p.name}<small>${p.tracker}</small></button>`).join("");
  return `<div class="mhead"><h2>Roadmap</h2><span class="crumb">Drag Features between groups. The group is saved on the Spec as a roadmap:* label; Ideas stay in fh until they have a Spec. Shipped Features drop off.</span></div>
    <div class="fhead">${chips}</div>
    <div class="roadmap">${groups.map(([g, label], gi) => {
      const items = roadmap[g].filter(([p]) => !filt || p === filt);
      return `<section class="rcol" data-group="${g}"><h4><span>${label}</span><span class="bd">${items.length}</span></h4><ol class="rlist">${items.map(([p, f]) => rCard(p, f, g, gi)).join("")}</ol></section>`;
    }).join("")}</div>`;
}
function rCard(pid, fid, g, gi) {
  const f = factory[pid].find(x => x.id === fid);
  const live = sessions.find(s => s.project === pid && s.feature === f.name && s.state !== "exited");
  const warn = live && g !== "now" ? `<span class="warn">Session running outside Now</span>` : "";
  return `<li class="rcard" draggable="true" data-rm="${pid}:${fid}">
    <div class="rtop"><span class="n">${f.name}</span><span class="stage">${f.stage}</span></div>
    <span class="ref">${proj(pid).name} · ${f.ref}</span>
    <div class="rmeta">${rdBadge(fid) || '<span class="bd">Idea · no readiness yet</span>'}${warn}</div>
    <div class="rmove"><button class="btn small" data-mv="${pid}:${fid}:-1" ${gi === 0 ? "disabled" : ""} aria-label="Move ${f.name} to the previous group">←</button><button class="btn small" data-mv="${pid}:${fid}:1" ${gi === 2 ? "disabled" : ""} aria-label="Move ${f.name} to the next group">→</button></div>
  </li>`;
}
const GROUPS = ["now", "next", "later"], GROUP_LABEL = { now: "Now", next: "Next", later: "Later" };
function moveFeature(key, toGroup, beforeKey) {
  const [pid, fid] = key.split(":");
  const from = GROUPS.find(g => roadmap[g].some(([p, f]) => p === pid && f === fid));
  roadmap[from] = roadmap[from].filter(([p, f]) => !(p === pid && f === fid));
  const list = roadmap[toGroup];
  const idx = beforeKey ? list.findIndex(([p, f]) => `${p}:${f}` === beforeKey) : -1;
  idx >= 0 ? list.splice(idx, 0, [pid, fid]) : list.push([pid, fid]);
  const f = factory[pid].find(x => x.id === fid);
  if (from !== toGroup) toast(f.stage === "Idea" ? `${f.name} moved to ${GROUP_LABEL[toGroup]} (kept in fh until it has a Spec)` : `${f.name} moved to ${GROUP_LABEL[toGroup]} · label roadmap:${toGroup} set on ${f.ref.split(" ·")[0]}`);
  renderMain();
}
function openConfirm(fid) {
  const f = factory.fh.concat(factory.io, factory.hf).find(x => x.id === fid);
  $("#overlay").innerHTML = `<div class="scrim" data-close="1"><div class="modal" role="dialog" aria-label="Plan not ready">
    <form id="confirm-form"><h3>${f.name} is not ready</h3>
      <p style="margin:0">${failing(fid).length} readiness check${failing(fid).length > 1 ? "s fail" : " fails"}. /implement-spec works unattended, so gaps in the plan turn into guesses in the code.</p>
      <ul class="fails">${failing(fid).map(i => `<li>${CHECKS[i]}${RD[fid].notes?.[i] ? ` <span class="crumb">· ${RD[fid].notes[i]}</span>` : ""}</li>`).join("")}</ul>
      <div class="acts" style="justify-content:flex-end"><button type="button" class="btn" data-close="1">Cancel</button><button type="submit" class="btn primary">Start anyway</button></div>
    </form></div></div>`;
  $("#confirm-form").addEventListener("submit", e => { e.preventDefault(); closeOverlay(); toast(`Session started: /implement-spec for ${f.name}`); });
}

/* actions */
function answer(id, ok) {
  const s = sess(id);
  s.perm.answer = ok ? "Allowed" : "Denied";
  s.state = ok ? "working" : "idle";
  toast(`${ok ? "Allowed" : "Denied"} for ${s.title}`);
  renderMain();
}
let toastTimer;
function toast(t) {
  let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.append(el); }
  el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2600);
}

function openPalette() {
  const ov = $("#overlay");
  ov.innerHTML = `<div class="scrim" data-close="1"><div class="palette" role="dialog" aria-label="Jump to a Session">
    <input id="pal-q" type="text" placeholder="Jump to a Session, Project or Ticket…" autocomplete="off"><ul id="pal-list"></ul></div></div>`;
  let hl = 0;
  const draw = () => {
    const q = $("#pal-q").value.toLowerCase();
    const list = sorted().filter(s => (s.title + proj(s.project).name + s.wt + AGENTS[s.agent].name).toLowerCase().includes(q));
    hl = Math.min(hl, Math.max(0, list.length - 1));
    const newItem = !q || "new session".includes(q) ? `<li><button data-new="1"><span></span><span><strong>+ New Session…</strong> <span class="crumb">· any Project, Worktree and Agent</span></span><span></span></button></li>` : "";
    $("#pal-list").innerHTML = newItem + list.map((s, i) => `<li><button class="${i === hl ? "hl" : ""}" data-open="${s.id}"><span class="dot ${s.state}"></span><span>${s.title} <span class="crumb">· ${proj(s.project).name}</span></span><span class="state ${s.state}">${STATE_LABEL[s.state]}</span></button></li>`).join("") || `<li class="empty-note">No Session matches.</li>`;
    return list;
  };
  draw();
  const q = $("#pal-q"); q.focus();
  q.addEventListener("input", () => { hl = 0; draw(); });
  q.addEventListener("keydown", e => {
    const list = draw();
    if (e.key === "ArrowDown") { hl = Math.min(hl + 1, list.length - 1); draw(); e.preventDefault(); }
    if (e.key === "ArrowUp") { hl = Math.max(hl - 1, 0); draw(); e.preventDefault(); }
    if (e.key === "Enter" && list[hl]) { go(list[hl].id); }
  });
}
function openNew(pid = ui.view === "sessions" ? sess(ui.current).project : "fh") {
  const p = proj(pid);
  const wts = p.worktrees.map(w => {
    const taken = sessions.find(s => s.project === p.id && s.wt === w.path);
    const why = w.agentWt ? "Agent worktree" : taken ? `has a Session (${STATE_LABEL[taken.state]})` : "";
    return `<label class="${why ? "dis" : ""}"><input type="radio" name="wt" value="${w.path}" ${why ? "disabled" : ""}><span class="mono">${w.path}</span>${why ? `<small>· ${why}</small>` : ""}</label>`;
  }).join("");
  $("#overlay").innerHTML = `<div class="scrim" data-close="1"><div class="modal" role="dialog" aria-label="New Session">
    <form id="new-form"><h3>New Session</h3>
      <label class="field"><span>Project</span><select id="nw-proj">${projects.map(x => `<option value="${x.id}" ${x.id === p.id ? "selected" : ""}>${x.name}</option>`).join("")}</select></label>
      <div class="field"><span>Worktree</span><div class="radios stack">
        <label><input type="radio" name="wt" value="__new" checked>New Worktree on branch <input type="text" id="nw-branch" value="quick-${sessions.length + 1}" aria-label="Branch name"></label>
        ${wts}
      </div><small class="crumb">One Session per Worktree. New Worktrees go to ${p.name}.worktrees/.</small></div>
      <div class="field"><span>Agent</span><div class="radios">
        ${Object.entries(AGENTS).map(([k, a], i) => `<label><input type="radio" name="agent" id="nw-ag-${k}" value="${k}" ${i === 0 ? "checked" : ""}>${a.name}</label>`).join("")}
      </div></div>
      <label class="field"><span>Starting prompt (optional)</span><input type="text" id="nw-prompt" placeholder="A message, or a skill such as /diagnosing-bugs"></label>
      <label class="toggle"><input type="checkbox" id="nw-auto"><span>Auto-approve in this Session<small>Off by default. Permission requests then go to the Inbox.</small></span></label>
      <div class="acts" style="justify-content:flex-end"><button type="button" class="btn" data-close="1">Cancel</button><button type="submit" class="btn primary">Start Session</button></div>
    </form></div></div>`;
  $("#nw-proj").addEventListener("change", e => openNew(e.target.value));
  $("#new-form").addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(e.target), agent = fd.get("agent"), choice = fd.get("wt");
    const branch = choice === "__new" ? ($("#nw-branch").value.trim() || `quick-${sessions.length + 1}`) : choice;
    if (choice === "__new") p.worktrees.push({ path: branch, branch });
    const prompt = $("#nw-prompt").value.trim().replace(/</g, "&lt;");
    const id = "n" + Date.now();
    sessions.push({ id, title: prompt ? (prompt.length > 44 ? prompt.slice(0, 44) + "…" : prompt) : "New Session", project: p.id, wt: branch, agent,
      state: prompt ? "working" : "idle", feature: null, stage: null, acp: "sess_new…", started: "just now",
      git: { ahead: 0, behind: 0, files: [], pr: "none" }, msgs: prompt ? [{ r: "user", t: prompt }] : [] });
    closeOverlay(); toast(`Session started: ${AGENTS[agent].name} in ${p.name} / ${branch}`); go(id);
  });
}
function closeOverlay() { $("#overlay").innerHTML = ""; }
function go(id) { ui.view = "sessions"; ui.current = id; closeOverlay(); renderMain(); }

function openStart(n) {
  const f = factory.fh.find(x => x.id === "f-acp"), t = f.tickets.find(x => x.n === n);
  const branch = `fh-${n}-reopen-session`;
  $("#overlay").innerHTML = `<div class="scrim" data-close="1"><div class="modal" role="dialog" aria-label="Start Session">
    <form id="start-form"><h3>Start Session from #${n}</h3><p class="crumb" style="margin:-8px 0 0">${t.t}</p>
      <div class="field"><span>Agent</span><div class="radios">
        ${Object.entries(AGENTS).map(([k, a], i) => `<label><input type="radio" name="agent" id="ag-${k}" value="${k}" ${i === 0 ? "checked" : ""}>${a.name}</label>`).join("")}
      </div></div>
      <div class="field"><span>New Worktree</span><input type="text" id="st-wt" value="fullharness.worktrees/${branch}"></div>
      <div class="field"><span>Starting prompt</span><input type="text" id="st-prompt" value="/implement #${n}"></div>
      <label class="toggle"><input type="checkbox" id="st-auto"><span>Auto-approve in this Session<small>Off by default. When on, the Agent's own auto-approve mode is used and nothing reaches the Inbox.</small></span></label>
      <div class="acts" style="justify-content:flex-end"><button type="button" class="btn" data-close="1">Cancel</button><button type="submit" class="btn primary">Start Session</button></div>
    </form></div></div>`;
  $("#start-form").addEventListener("submit", e => {
    e.preventDefault();
    const agent = new FormData(e.target).get("agent");
    const id = "s" + (sessions.length + 10);
    projects[0].worktrees.push({ path: branch, branch });
    sessions.push({ id, title: `#${n} Reopen a Session via session/load`, project: "fh", wt: branch, agent, state: "working",
      feature: "ACP session view", stage: "Implementing", ticket: { n, title: t.t }, acp: "sess_new…", started: "just now",
      git: { ahead: 0, behind: 0, files: [], pr: "none" },
      msgs: [{ r: "user", t: $("#st-prompt").value }, { r: "tool", k: "Read", d: `issue #${n}`, s: "run", out: "…" }] });
    t.stage = "Implementing"; t.note = `Session · ${AGENTS[agent].name}`; t.sid = id;
    f.bd = { shipped: 2, review: 1, implementing: 2, todo: 1 };
    closeOverlay(); toast(`Session started in ${branch}`); go(id);
  });
}

document.addEventListener("click", e => {
  const b = e.target.closest("button, .scrim");
  if (!b) return;
  if (b.classList.contains("scrim") && e.target !== b) return;
  const d = b.dataset;
  if (d.close) return closeOverlay();
  if (d.sid) { ui.view = "sessions"; ui.current = d.sid; return renderMain(); }
  if (d.open) return go(d.open);
  if (b.classList.contains("tab")) { ui.view = d.view; return renderMain(); }
  if (d.allow) return answer(d.allow, true);
  if (d.deny) return answer(d.deny, false);
  if (d.viewmode) { sess(ui.current).view = d.viewmode; return renderMain(); }
  if (d.reopen) { const s = sess(d.reopen); s.state = "idle"; s.msgs.push({ r: "agent", t: ["Session reopened via session/load. History restored."] }); toast("Session reopened"); return renderMain(); }
  if (d.fproj) { ui.factoryProject = d.fproj; ui.feature = (factory[d.fproj] || [])[0]?.id; return renderMain(); }
  if (d.feat) { ui.feature = d.feat; return renderMain(); }
  if (d.start) return openStart(+d.start);
  if (d.new) return openNew();
  if (d.confirm) return openConfirm(d.confirm);
  if (d.rmproj !== undefined) { ui.rmProject = d.rmproj; return renderMain(); }
  if (d.mv) { const [p, f, dir] = d.mv.split(":"); const from = GROUPS.find(g => roadmap[g].some(([x, y]) => x === p && y === f)); return moveFeature(`${p}:${f}`, GROUPS[GROUPS.indexOf(from) + (+dir)]); }
  if (d.grill) return toast("New Worktree idea/… created; Session started with /grill-with-docs");
  if (d.toast) return toast(d.toast);
  if (b.id === "jump-btn") return openPalette();
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-send]"); if (!f) return;
  e.preventDefault();
  const inp = $("#composer-input"), v = inp.value.trim(); if (!v) return;
  const s = sess(f.dataset.send); s.msgs.push({ r: "user", t: v.replace(/</g, "&lt;") }); s.state = "working"; renderMain();
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); }
  if (e.key === "Escape") closeOverlay();
});
let dragKey = null;
document.addEventListener("dragstart", e => { const c = e.target.closest?.(".rcard"); if (!c) return; dragKey = c.dataset.rm; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", dragKey); } catch (_) {} });
document.addEventListener("dragend", () => { dragKey = null; document.querySelectorAll(".dragging, .over").forEach(el => el.classList.remove("dragging", "over")); });
document.addEventListener("dragover", e => { const col = e.target.closest?.(".rcol"); if (!col || !dragKey) return; e.preventDefault(); document.querySelectorAll(".rcol.over").forEach(el => el !== col && el.classList.remove("over")); col.classList.add("over"); });
document.addEventListener("drop", e => { const col = e.target.closest?.(".rcol"); if (!col || !dragKey) return; e.preventDefault(); const before = e.target.closest(".rcard"); const k = dragKey; dragKey = null; moveFeature(k, col.dataset.group, before && before.dataset.rm !== k ? before.dataset.rm : null); });
renderMain();
</script>
