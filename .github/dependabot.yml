# ADR 0007: weekly updates, minor and patch grouped into one PR per
# ecosystem; major updates stay separate PRs so each gets its own look.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/tools"] # /tools pins golangci-lint and govulncheck
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
