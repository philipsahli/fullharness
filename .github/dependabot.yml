# ADR 0007: weekly updates, minor and patch grouped into one PR per
# ecosystem; major updates stay separate PRs so each gets its own look.
# Exception: the npm "react" group below takes React majors too (#34).
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/tools"] # /tools pins golangci-lint and govulncheck
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # Contributors run Node 22 (web/.nvmrc); newer @types/node majors
      # describe APIs they don't have. Raise this with .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # React and its types only install at matching versions (#34), so they
      # move together, majors included. Listed first: a package joins the
      # first group it matches.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
