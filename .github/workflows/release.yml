# Release (#16): pushing a version tag (v1.2.3) builds the macOS binaries with
# GoReleaser (.goreleaser.yaml), attaches them and checksums.txt to a GitHub
# Release, and updates the cask in philipsahli/homebrew-tap. The real-Agent
# smoke test (make smoke) runs on the maintainer's Mac before tagging, never
# here (ADR 0007). The README's "Releasing" section has the full checklist.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload its files

jobs:
  release:
    # macOS, fh's only target OS; a release is rare, so the 10x minutes don't matter.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from the tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT, contents write on philipsahli/homebrew-tap only.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
